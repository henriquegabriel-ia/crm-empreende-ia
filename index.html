<!doctype html>
<html lang="pt-BR" class="eia-theme dark" data-eia-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>%CRM_BRAND_NAME%</title>
    <!-- Instância privada de uma empresa: fora dos buscadores. Para reverter, ver "Instância fora dos buscadores" no README. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta
      name="description"
      content="Seu CRM para organizar relacionamentos, oportunidades e os próximos passos da equipe."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="%CRM_BRAND_NAME%" />
    <meta property="og:description" content="Relacionamentos, oportunidades e próximos passos no mesmo lugar." />
    <meta name="twitter:card" content="summary" />
    <!-- Título, og:title e favicon da marca da instância (public/brand/brand.json), trocados no build pelo plugin crm-brand (docs/MARCA.md). -->
    <!-- %CRM_BRAND_ICON% -->
    <link rel="preload" href="/fonts/Manrope-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      (() => {
        let theme = 'dark';
        try {
          const saved = localStorage.getItem('empreende-ia-theme');
          if (['dark', 'light', 'system'].includes(saved)) theme = saved;
        } catch {}
        const resolved =
          theme === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
        const root = document.documentElement;
        root.dataset.eiaTheme = resolved;
        root.classList.toggle('dark', resolved === 'dark');
        root.classList.toggle('light', resolved === 'light');
        root.style.colorScheme = resolved;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
